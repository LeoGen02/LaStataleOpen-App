name: StataleOpen
options:
  developmentLanguage: it
  deploymentTarget:
    iOS: "17.0"
targets:
  StataleOpen:
    type: application
    platform: iOS
    sources:
      - StataleOpen
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: "Statale Open"
        # Interfaccia in italiano: anche date, giorni e testi di sistema (Annulla, OK…) in italiano.
        CFBundleDevelopmentRegion: it
        CFBundleLocalizations:
          - it
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        ITSAppUsesNonExemptEncryption: false
        # Repository GitHub per aggiornamenti e segnalazioni (la build di GitHub Actions usa quello da cui parte).
        StataleOpenRepository: "$(STATALE_REPOSITORY)"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes:
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - it.leonardo.stataleopen.refresh
        CFBundleURLTypes:
          - CFBundleURLName: it.leonardo.stataleopen
            CFBundleURLSchemes:
              - stataleopen
        NSCameraUsageDescription: "Serve per allegare foto o video alle consegne delle e-tivity."
        NSPhotoLibraryUsageDescription: "Serve per allegare immagini alle consegne delle e-tivity."
        NSMicrophoneUsageDescription: "Serve per registrare audio o video da allegare alle consegne."
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: it.leonardo.stataleopen
      TARGETED_DEVICE_FAMILY: "1"
      SWIFT_VERSION: "5.0"
      # Versione di sviluppo; le release la prendono dal tag (v1.2.0 → 1.2.0), il numero di build dai commit.
      MARKETING_VERSION: "1.2.0"
      CURRENT_PROJECT_VERSION: "1"
      STATALE_REPOSITORY: "LeoGen02/LaStataleOpen-App"
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    scheme:
      testTargets:
        - StataleOpenTests
  StataleOpenTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - StataleOpenTests
    dependencies:
      - target: StataleOpen
    settings:
      GENERATE_INFOPLIST_FILE: YES
      PRODUCT_BUNDLE_IDENTIFIER: it.leonardo.stataleopen.tests
      TARGETED_DEVICE_FAMILY: "1"
      SWIFT_VERSION: "5.0"

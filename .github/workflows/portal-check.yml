# Diagnostica del portale: come accettano l'accesso le app? Solo indirizzi pubblici, nessuna credenziale.
# Actions → Controllo del portale → Run workflow; il risultato è nel log del job.
name: Controllo del portale

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/portal-check.yml'
      - 'docs/ponte/**'

permissions:
  contents: read

jobs:
  check:
    name: Configurazione pubblica del portale
    runs-on: ubuntu-latest
    steps:
      - name: Risposte del portale
        env:
          P: https://lastataleopen.myariel.unimi.it
          ORIGIN: https://leogen02.github.io
        run: |
          show() { echo; echo "=================== $1"; }
          show "token.php?appsitecheck=1 (servizi per app attivi?)"
          curl -sS -i --max-time 25 -H "Origin: $ORIGIN" "$P/login/token.php?appsitecheck=1" | grep -viE "^(set-cookie|x-|date|server|expires|pragma|cache-control):" | head -n 30 || true
          show "server.php con chiave non valida (protocollo REST attivo? CORS?)"
          curl -sS -i --max-time 25 -H "Origin: $ORIGIN" -X POST "$P/webservice/rest/server.php" \
            -d "wstoken=00000000000000000000000000000000&wsfunction=core_webservice_get_site_info&moodlewsrestformat=json" \
            | grep -viE "^(set-cookie|x-|date|server|expires|pragma|cache-control):" | head -n 30 || true
          show "tool_mobile_get_public_config (tipo di accesso per le app)"
          curl -sS --max-time 25 -X POST "$P/lib/ajax/service-nologin.php?info=tool_mobile_get_public_config&lang=it" \
            -H "Content-Type: application/json" -d '[{"index":0,"methodname":"tool_mobile_get_public_config","args":{}}]' \
            | python3 -c 'import json,sys
          raw=sys.stdin.read()
          try:
              data=json.loads(raw)
              d=data[0].get("data") or data[0]
              keep=["sitename","release","version","enablewebservices","enablemobilewebservice","typeoflogin","launchurl","identityproviders","authloginviaemail","tool_mobile_qrcodetype","maintenanceenabled","tool_mobile_disabledfeatures","httpswwwroot"]
              print(json.dumps({k:d.get(k) for k in keep if k in d}, indent=2, ensure_ascii=False))
              if data[0].get("error"): print("errore:", json.dumps(data[0], ensure_ascii=False)[:800])
          except Exception as e:
              print("risposta non JSON:", raw[:800])' || true
          show "launch.php senza accesso (dove rimanda?)"
          curl -sS -o /dev/null -w "HTTP %{http_code} → %{redirect_url}\n" --max-time 25 "$P/admin/tool/mobile/launch.php?service=moodle_mobile_app&passport=123&urlscheme=stataleopen" || true
          show "login/index.php (dove rimanda?)"
          curl -sS -o /dev/null -w "HTTP %{http_code} → %{redirect_url}\n" --max-time 25 "$P/login/index.php" || true
          show "Intestazioni di sicurezza delle pagine (CSP, frame, permessi): il ponte dell'app web può girare sul portale?"
          for path in / /login/index.php /login/forgot_password.php /my/ /course/index.php /lib/ajax/service.php; do
            echo "--- $path"
            curl -sS -o /dev/null -D - --max-time 25 "$P$path" | grep -iE "^(HTTP/|content-security-policy|x-frame-options|permissions-policy|cross-origin-|x-content-type-options|referrer-policy|location:)" || true
          done
          show "Tema e configurazione JS di una pagina pubblica (login/forgot_password.php)"
          curl -sS --max-time 25 "$P/login/forgot_password.php" | grep -oE '"theme":"[^"]*"|/theme/styles\.php/[a-z0-9_]+/|"release":"[^"]*"|<html[^>]*>|<meta http-equiv="Content-Security-Policy"[^>]*>' | sort -u | head -n 20 || true
          echo
          show "token.php con credenziali inventate (che errore dà?)"
          curl -sS --max-time 25 -X POST "$P/login/token.php" -d "username=prova.inesistente&password=x&service=moodle_mobile_app" | head -c 600 || true
          echo

  ponte:
    name: Ponte pubblicato su GitHub Pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Il preferito carica il ponte con l'impronta SHA-384 e crossorigin: il file pubblicato deve essere identico
      # a quello del repository e avere Access-Control-Allow-Origin. Aspetta la pubblicazione (fino a 10 minuti).
      - name: Impronta e CORS del ponte pubblicato
        env:
          PAGES: https://leogen02.github.io/LaStataleOpen-App/
        run: |
          FILE=$(sed -nE 's/^ *file: "(ponte\/ponte-[0-9]+\.js)".*/\1/p' docs/core.js | head -n 1)
          WANT=$(sed -nE 's/^ *sri: "(sha384-[^"]+)".*/\1/p' docs/core.js | head -n 1)
          LOCAL="sha384-$(openssl dgst -sha384 -binary "docs/$FILE" | base64 -w0)"
          echo "file $FILE · impronta attesa $WANT"
          [ "$LOCAL" = "$WANT" ] || { echo "::error::docs/$FILE non corrisponde all'impronta in docs/core.js"; exit 1; }
          for i in $(seq 1 30); do
            HEADERS=$(curl -sS -D - -o ponte.js --max-time 25 "$PAGES$FILE?controllo=$i" || true)
            GOT="sha384-$(openssl dgst -sha384 -binary ponte.js | base64 -w0)"
            CORS=$(echo "$HEADERS" | grep -i '^access-control-allow-origin:' | tr -d '\r' || true)
            if [ "$GOT" = "$WANT" ]; then
              echo "pubblicato: $GOT"
              echo "${CORS:-nessuna intestazione CORS}"
              echo "$CORS" | grep -q '\*' || { echo "::error::GitHub Pages non manda Access-Control-Allow-Origin: il preferito non potrebbe caricare il ponte"; exit 1; }
              exit 0
            fi
            echo "tentativo $i: pubblicato ancora $GOT, attendo…"; sleep 20
          done
          echo "::error::Dopo 10 minuti GitHub Pages serve un ponte diverso da quello del repository"; exit 1

      # Lo script del ponte automatico si installa dalla copia su Pages: deve essere quello del repository.
      - name: Script del ponte automatico pubblicato
        env:
          PAGES: https://leogen02.github.io/LaStataleOpen-App/
        run: |
          FILE=$(sed -nE 's/^ *userscript: "(ponte\/[a-z0-9-]+\.user\.js)".*/\1/p' docs/core.js | head -n 1)
          WANT="sha384-$(openssl dgst -sha384 -binary "docs/$FILE" | base64 -w0)"
          grep -q "\"$FILE\": \"$WANT\"" docs/core.js || { echo "::error::$FILE non corrisponde a PONTE.known in docs/core.js"; exit 1; }
          for i in $(seq 1 30); do
            curl -sS -o script.user.js --max-time 25 "$PAGES$FILE?controllo=$i" || true
            GOT="sha384-$(openssl dgst -sha384 -binary script.user.js | base64 -w0)"
            if [ "$GOT" = "$WANT" ]; then echo "pubblicato: $FILE $GOT"; exit 0; fi
            echo "tentativo $i: pubblicato ancora $GOT, attendo…"; sleep 20
          done
          echo "::error::Dopo 10 minuti GitHub Pages serve uno script diverso da quello del repository"; exit 1

  accesso:
    name: Pagina di login di Ateneo (struttura, nessuna credenziale vera)
    runs-on: ubuntu-latest
    steps:
      # Com'è fatto il login che il server di accesso deve compilare: moduli, campi, script, cookie (solo nomi).
      # Un solo tentativo con un utente inventato, per vedere come risponde a credenziali sbagliate.
      - name: Struttura del login
        env:
          P: https://lastataleopen.myariel.unimi.it
        run: |
          cat > sso.py <<'PY'
          import sys, re, json, html, urllib.parse
          from html.parser import HTMLParser
          class P(HTMLParser):
              def __init__(s):
                  super().__init__(); s.forms=[]; s.cur=None; s.scripts=[]; s.inline=[]; s.meta=[]; s.title=""; s._t=False; s._s=False; s.links=[]; s.iframes=[]
              def handle_starttag(s, tag, a):
                  a=dict(a)
                  if tag=="form":
                      s.cur={"action":a.get("action"),"method":a.get("method"),"id":a.get("id"),"name":a.get("name"),"onsubmit":(a.get("onsubmit") or "")[:120],"fields":[]}; s.forms.append(s.cur)
                  elif tag in("input","button","select","textarea"):
                      f={"tag":tag,"type":a.get("type"),"name":a.get("name"),"id":a.get("id"),"value_len":len(a.get("value") or ""),"autocomplete":a.get("autocomplete"),"onclick":(a.get("onclick") or "")[:160]}
                      if a.get("type") in ("submit","button") or tag=="button": f["value"]=(a.get("value") or "")[:40]
                      if a.get("type")=="hidden" and (a.get("name") or "") in ("url","ReturnUrl","returnUrl","service","target"): f["value"]=(a.get("value") or "")[:200]
                      (s.cur["fields"] if s.cur is not None else s.links).append(f)
                  elif tag=="script":
                      if a.get("src"): s.scripts.append(a.get("src"))
                      else: s._s=True
                  elif tag=="meta" and (a.get("http-equiv") or "").lower() in ("refresh","content-security-policy"): s.meta.append(a)
                  elif tag=="title": s._t=True
                  elif tag=="iframe": s.iframes.append(a.get("src"))
                  elif tag=="a" and a.get("href") and ("javascript" in a.get("href") or "PostBack" in a.get("href")): s.links.append({"a":a.get("href")[:200],"id":a.get("id")})
              def handle_endtag(s, tag):
                  if tag=="form": s.cur=None
                  if tag=="title": s._t=False
                  if tag=="script": s._s=False
              def handle_data(s, d):
                  if s._t: s.title+=d.strip()
                  if s._s and d.strip():
                      t=d.strip()
                      s.inline.append({"len":len(t),"hints":sorted(set(re.findall(r"__doPostBack|WebForm_DoPostBackWithOptions|submit\(\)|location\.(?:href|replace|assign)|recaptcha|hcaptcha|turnstile|grecaptcha|captcha|fetch\(|XMLHttpRequest|\$\.ajax|crypto|encrypt|btoa|sha|md5|document\.forms|\.value\s*=", t, re.I))),"head":t[:300]})
          raw=open(sys.argv[1],encoding="utf-8",errors="replace").read()
          p=P(); p.feed(raw)
          print("titolo:", p.title, "· byte:", len(raw))
          print("script esterni:", json.dumps(p.scripts, indent=1))
          print("iframe:", p.iframes, "meta:", p.meta)
          for f in p.forms: print("FORM", json.dumps(f, indent=1, ensure_ascii=False))
          print("campi fuori dai form / link js:", json.dumps(p.links, indent=1, ensure_ascii=False)[:3000])
          for s in p.inline: print("INLINE", json.dumps(s, ensure_ascii=False))
          text=re.sub(r"\s+"," ",html.unescape(re.sub(r"<[^>]+>"," ",re.sub(r"(?is)<(script|style)[^>]*>.*?</\1>"," ",raw))))
          for kw in ("errat","non valid","non corrett","error","sbagliat","bloccat","tentativ","captcha","password"):
              for m in re.finditer(kw, text, re.I):
                  print("TESTO[", kw, "]:", text[max(0,m.start()-120):m.end()+160]); break
          PY
          cat > fill.py <<'PY'
          # Costruisce il POST del modulo con la password, come farebbe un browser senza JavaScript.
          import sys, urllib.parse
          from html.parser import HTMLParser
          class P(HTMLParser):
              def __init__(s): super().__init__(); s.forms=[]; s.cur=None
              def handle_starttag(s, tag, a):
                  a=dict(a)
                  if tag=="form": s.cur={"action":a.get("action") or "","method":(a.get("method") or "get").lower(),"f":[]}; s.forms.append(s.cur)
                  elif tag in("input","button") and s.cur is not None: s.cur["f"].append((tag,(a.get("type") or ("submit" if tag=="button" else "text")).lower(),a.get("name"),a.get("value") or ""))
              def handle_endtag(s, tag):
                  if tag=="form": s.cur=None
          raw=open(sys.argv[1],encoding="utf-8",errors="replace").read(); base=sys.argv[2]
          p=P(); p.feed(raw)
          form=next((f for f in p.forms if any(x[1]=="password" for x in f["f"])), None)
          if not form: print("NOFORM"); sys.exit(0)
          data=[]; pw_idx=[i for i,x in enumerate(form["f"]) if x[1]=="password"][0]; sub=False
          users=[x for i,x in enumerate(form["f"][:pw_idx]) if x[1] in ("text","email") and x[2]]
          for i,(tag,typ,name,val) in enumerate(form["f"]):
              if not name: continue
              if typ=="password": data.append((name,"PasswordInventata123!"))
              elif users and name==users[-1][2]: data.append((name,"prova.inesistente.statale.open@example.com"))
              elif typ in ("submit","image","button"):
                  if not sub: data.append((name,val)); sub=True
              elif typ in ("checkbox","radio"): pass
              else: data.append((name,val))
          print(urllib.parse.urljoin(base, form["action"]))
          print(urllib.parse.urlencode(data))
          print(" ".join(n for n,_ in data), file=sys.stderr)
          PY
          UA="Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/18.0 Mobile/15E148 Safari/604.1"
          echo "=== 1. Portale → login (catena dei reindirizzamenti)"
          curl -sS -A "$UA" -c jar -b jar -L --max-redirs 10 -D chain.txt -o sso.html -w "finale: %{http_code} %{url_effective}\n" --max-time 30 "$P/login/index.php" || true
          grep -iE "^(HTTP/|location:|content-security-policy|x-frame-options|set-cookie)" chain.txt | sed -E 's/(set-cookie: *[^=]+)=[^;]*/\1=…/I'
          echo "=== cookie (solo nomi e domini)"; awk '!/^#/ || /^#HttpOnly_/ {print $1, $6}' jar | sed 's/#HttpOnly_//'
          echo "=== 2. Pagina di login"; python3 sso.py sso.html
          FINAL=$(curl -sS -A "$UA" -c jar -b jar -L -o /dev/null -w "%{url_effective}" --max-time 30 "$P/login/index.php" || true)
          curl -sS -A "$UA" -c jar -b jar -o sso.html --max-time 30 "$FINAL" || true
          echo "=== 3. Invio con un utente inventato"
          python3 fill.py sso.html "$FINAL" > post.txt || true
          cat post.txt | head -1
          if [ "$(head -1 post.txt)" != "NOFORM" ] && [ -s post.txt ]; then
            ACTION=$(sed -n 1p post.txt); BODY=$(sed -n 2p post.txt)
            curl -sS -A "$UA" -c jar -b jar -e "$FINAL" -H "Origin: https://elearning.unimi.it" -L --max-redirs 10 --data "$BODY" -D post-h.txt -o after.html -w "finale: %{http_code} %{url_effective} (%{num_redirects} reindirizzamenti)\n" --max-time 30 "$ACTION" || true
            grep -iE "^(HTTP/|location:|set-cookie)" post-h.txt | sed -E 's/(set-cookie: *[^=]+)=[^;]*/\1=…/I'
            echo "--- pagina dopo l'invio"; python3 sso.py after.html | head -n 120
          fi
          echo "=== 4. Pagina di registrazione / recupero (link dal login)"
          grep -oiE 'href="[^"]*(registr|recuper|password|forgot|signup)[^"]*"' sso.html | sort -u | head -n 10 || true

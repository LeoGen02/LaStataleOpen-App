# Diagnostica del portale: come accettano l'accesso le app? Solo indirizzi pubblici, nessuna credenziale.
# Actions → Controllo del portale → Run workflow; il risultato è nel log del job.
name: Controllo del portale

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/portal-check.yml'
      - 'docs/ponte/**'

permissions:
  contents: read

jobs:
  check:
    name: Configurazione pubblica del portale
    runs-on: ubuntu-latest
    steps:
      - name: Risposte del portale
        env:
          P: https://lastataleopen.myariel.unimi.it
          ORIGIN: https://leogen02.github.io
        run: |
          show() { echo; echo "=================== $1"; }
          show "token.php?appsitecheck=1 (servizi per app attivi?)"
          curl -sS -i --max-time 25 -H "Origin: $ORIGIN" "$P/login/token.php?appsitecheck=1" | grep -viE "^(set-cookie|x-|date|server|expires|pragma|cache-control):" | head -n 30 || true
          show "server.php con chiave non valida (protocollo REST attivo? CORS?)"
          curl -sS -i --max-time 25 -H "Origin: $ORIGIN" -X POST "$P/webservice/rest/server.php" \
            -d "wstoken=00000000000000000000000000000000&wsfunction=core_webservice_get_site_info&moodlewsrestformat=json" \
            | grep -viE "^(set-cookie|x-|date|server|expires|pragma|cache-control):" | head -n 30 || true
          show "tool_mobile_get_public_config (tipo di accesso per le app)"
          curl -sS --max-time 25 -X POST "$P/lib/ajax/service-nologin.php?info=tool_mobile_get_public_config&lang=it" \
            -H "Content-Type: application/json" -d '[{"index":0,"methodname":"tool_mobile_get_public_config","args":{}}]' \
            | python3 -c 'import json,sys
          raw=sys.stdin.read()
          try:
              data=json.loads(raw)
              d=data[0].get("data") or data[0]
              keep=["sitename","release","version","enablewebservices","enablemobilewebservice","typeoflogin","launchurl","identityproviders","authloginviaemail","tool_mobile_qrcodetype","maintenanceenabled","tool_mobile_disabledfeatures","httpswwwroot"]
              print(json.dumps({k:d.get(k) for k in keep if k in d}, indent=2, ensure_ascii=False))
              if data[0].get("error"): print("errore:", json.dumps(data[0], ensure_ascii=False)[:800])
          except Exception as e:
              print("risposta non JSON:", raw[:800])' || true
          show "launch.php senza accesso (dove rimanda?)"
          curl -sS -o /dev/null -w "HTTP %{http_code} → %{redirect_url}\n" --max-time 25 "$P/admin/tool/mobile/launch.php?service=moodle_mobile_app&passport=123&urlscheme=stataleopen" || true
          show "login/index.php (dove rimanda?)"
          curl -sS -o /dev/null -w "HTTP %{http_code} → %{redirect_url}\n" --max-time 25 "$P/login/index.php" || true
          show "Intestazioni di sicurezza delle pagine (CSP, frame, permessi): il ponte dell'app web può girare sul portale?"
          for path in / /login/index.php /login/forgot_password.php /my/ /course/index.php /lib/ajax/service.php; do
            echo "--- $path"
            curl -sS -o /dev/null -D - --max-time 25 "$P$path" | grep -iE "^(HTTP/|content-security-policy|x-frame-options|permissions-policy|cross-origin-|x-content-type-options|referrer-policy|location:)" || true
          done
          show "Tema e configurazione JS di una pagina pubblica (login/forgot_password.php)"
          curl -sS --max-time 25 "$P/login/forgot_password.php" | grep -oE '"theme":"[^"]*"|/theme/styles\.php/[a-z0-9_]+/|"release":"[^"]*"|<html[^>]*>|<meta http-equiv="Content-Security-Policy"[^>]*>' | sort -u | head -n 20 || true
          echo
          show "token.php con credenziali inventate (che errore dà?)"
          curl -sS --max-time 25 -X POST "$P/login/token.php" -d "username=prova.inesistente&password=x&service=moodle_mobile_app" | head -c 600 || true
          echo

  ponte:
    name: Ponte pubblicato su GitHub Pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Il preferito carica il ponte con l'impronta SHA-384 e crossorigin: il file pubblicato deve essere identico
      # a quello del repository e avere Access-Control-Allow-Origin. Aspetta la pubblicazione (fino a 10 minuti).
      - name: Impronta e CORS del ponte pubblicato
        env:
          PAGES: https://leogen02.github.io/LaStataleOpen-App/
        run: |
          FILE=$(sed -nE 's/^ *file: "(ponte\/ponte-[0-9]+\.js)".*/\1/p' docs/core.js | head -n 1)
          WANT=$(sed -nE 's/^ *sri: "(sha384-[^"]+)".*/\1/p' docs/core.js | head -n 1)
          LOCAL="sha384-$(openssl dgst -sha384 -binary "docs/$FILE" | base64 -w0)"
          echo "file $FILE · impronta attesa $WANT"
          [ "$LOCAL" = "$WANT" ] || { echo "::error::docs/$FILE non corrisponde all'impronta in docs/core.js"; exit 1; }
          for i in $(seq 1 30); do
            HEADERS=$(curl -sS -D - -o ponte.js --max-time 25 "$PAGES$FILE?controllo=$i" || true)
            GOT="sha384-$(openssl dgst -sha384 -binary ponte.js | base64 -w0)"
            CORS=$(echo "$HEADERS" | grep -i '^access-control-allow-origin:' | tr -d '\r' || true)
            if [ "$GOT" = "$WANT" ]; then
              echo "pubblicato: $GOT"
              echo "${CORS:-nessuna intestazione CORS}"
              echo "$CORS" | grep -q '\*' || { echo "::error::GitHub Pages non manda Access-Control-Allow-Origin: il preferito non potrebbe caricare il ponte"; exit 1; }
              exit 0
            fi
            echo "tentativo $i: pubblicato ancora $GOT, attendo…"; sleep 20
          done
          echo "::error::Dopo 10 minuti GitHub Pages serve un ponte diverso da quello del repository"; exit 1

      # Lo script del ponte automatico si installa dalla copia su Pages: deve essere quello del repository.
      - name: Script del ponte automatico pubblicato
        env:
          PAGES: https://leogen02.github.io/LaStataleOpen-App/
        run: |
          FILE=$(sed -nE 's/^ *userscript: "(ponte\/[a-z0-9-]+\.user\.js)".*/\1/p' docs/core.js | head -n 1)
          WANT="sha384-$(openssl dgst -sha384 -binary "docs/$FILE" | base64 -w0)"
          grep -q "\"$FILE\": \"$WANT\"" docs/core.js || { echo "::error::$FILE non corrisponde a PONTE.known in docs/core.js"; exit 1; }
          for i in $(seq 1 30); do
            curl -sS -o script.user.js --max-time 25 "$PAGES$FILE?controllo=$i" || true
            GOT="sha384-$(openssl dgst -sha384 -binary script.user.js | base64 -w0)"
            if [ "$GOT" = "$WANT" ]; then echo "pubblicato: $FILE $GOT"; exit 0; fi
            echo "tentativo $i: pubblicato ancora $GOT, attendo…"; sleep 20
          done
          echo "::error::Dopo 10 minuti GitHub Pages serve uno script diverso da quello del repository"; exit 1
